import java.security.MessageDigest

plugins {
    id "com.android.application"
}

// Release signing key: keystore.properties next to settings.gradle, never in
// git (storeFile, storePassword, keyAlias, keyPassword). Without it a release
// build is signed with the debug key, only good for testing.
def keystoreProps = new Properties()
def keystorePropsFile = rootProject.file("keystore.properties")
if (keystorePropsFile.exists()) {
    keystorePropsFile.withInputStream { keystoreProps.load(it) }
}

android {
    namespace "io.github.francofuster.zeq2remaster"
    compileSdk 36
    ndkVersion "29.0.14206865"

    defaultConfig {
        applicationId "io.github.francofuster.zeq2remaster"
        minSdk 24
        targetSdk 36
        versionCode project.property("zeqVersionCode").toInteger()
        versionName project.property("zeqVersionName").toString()

        ndk {
            abiFilters.addAll(project.property("zeqAbis").toString().split(","))
        }

        externalNativeBuild {
            cmake {
                arguments "-DANDROID_STL=c++_static"
                targets "SDL2", "main", "cgame", "game", "ui"
            }
        }
    }

    externalNativeBuild {
        cmake {
            path file("../../CMakeLists.txt")
            version "3.31.6"
        }
    }

    signingConfigs {
        release {
            if (keystorePropsFile.exists()) {
                storeFile rootProject.file(keystoreProps["storeFile"])
                storePassword keystoreProps["storePassword"]
                keyAlias keystoreProps["keyAlias"]
                keyPassword keystoreProps["keyPassword"]
            }
        }
    }

    buildTypes {
        release {
            // Native code optimized (CMake Release), no debugger; the Java is
            // small and kept as it is
            signingConfig keystorePropsFile.exists() ? signingConfigs.release : signingConfigs.debug
            minifyEnabled false
            debuggable false
        }
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_11
        targetCompatibility JavaVersion.VERSION_11
    }

    androidResources {
        // The data zip is extracted on the first run: storing it uncompressed
        // in the APK costs no space (its entries are already deflated) and
        // lets SetupActivity stream it.
        noCompress += ["zip"]
    }

    packaging {
        jniLibs {
            // Uncompressed and 16 KB aligned, the way Android 15+ wants them.
            useLegacyPackaging false
        }
    }

    lint {
        abortOnError false
        checkReleaseBuilds false
    }
}

// --- Game data ---------------------------------------------------------------
// Build-Android/ZEQ2 is packed as zeq2data.zip. The release APK does not carry
// it: the zip goes to the GitHub release next to the APK, and SetupActivity
// downloads it the first time and then only the files that change
// (Build-Android.ps1 -Stage / -Publish). A debug APK carries it as
// assets/zeq2data.zip, so it installs and plays without a release;
// -PzeqBundleData=true or false overrides that for either build type.
// SetupActivity writes the data as the loose files the engine reads on PC (a
// pk3 would change what trap_FS_GetFileList returns for folders, which the
// fighter list and the bots rely on). zeq2data.id identifies the data.
def zeqDataDir = file("../../../Build-Android/ZEQ2")
// Files of the Android build only, versioned with the source: the touch
// control images (tools/make_touch_art.py writes them)
def zeqAndroidDataDir = file("../data")
def zeqDataExcludes = [
    "empty.pk3", "zeq2.bmp", "**/*.psd", "**/Thumbs.db",
    "zeq2config*.cfg", "qconsole.log", "zeq2history", "crashlog.txt", "screenshots/**", "vm/**"
]

def packZeqData = tasks.register("packZeqData", Zip) {
    from(zeqDataDir) {
        exclude zeqDataExcludes
    }
    from(zeqAndroidDataDir)
    archiveFileName = "zeq2data.zip"
    preserveFileTimestamps = false
    reproducibleFileOrder = true
    includeEmptyDirs = false

    doLast {
        def zip = archiveFile.get().asFile
        def digest = MessageDigest.getInstance("SHA-256")
        zip.withInputStream { input ->
            byte[] buffer = new byte[1 << 20]
            int n
            while ((n = input.read(buffer)) > 0) {
                digest.update(buffer, 0, n)
            }
        }
        long bytes = 0
        int count = 0
        (project.fileTree(zeqDataDir) { exclude zeqDataExcludes } + project.fileTree(zeqAndroidDataDir)).each { f ->
            bytes += f.length()
            count++
        }
        // Line 1: content hash. Line 2: bytes once unpacked. Line 3: files.
        new File(zip.parentFile, "zeq2data.id").text =
                digest.digest().encodeHex().toString() + "\n" + bytes + "\n" + count + "\n"
    }
}

def zeqBundleData = project.findProperty("zeqBundleData")

androidComponents {
    onVariants(selector().all()) { variant ->
        boolean bundle = zeqBundleData != null ? zeqBundleData.toString().toBoolean() : variant.buildType == "debug"
        if (bundle) {
            variant.sources.assets.addGeneratedSourceDirectory(packZeqData) { it.destinationDirectory }
        }
    }
}

// destinationDirectory is not a task output for Gradle, so the line above
// registers the folder but not the dependency: make it explicit.
tasks.named("preBuild").configure { dependsOn packZeqData }
