org.gradle.jvmargs=-Xmx3g -Dfile.encoding=UTF-8
org.gradle.parallel=true

# ABIs to build. The APK for phones only needs arm64-v8a; add x86_64 to run it
# on a PC emulator: gradlew assembleDebug -PzeqAbis=arm64-v8a,x86_64
zeqAbis=arm64-v8a

# Version of the APK. The code must go up with every APK given to players,
# or Android refuses to install it over the old one.
zeqVersionCode=5
zeqVersionName=1.4-alpha1
