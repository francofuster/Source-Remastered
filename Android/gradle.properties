org.gradle.jvmargs=-Xmx3g -Dfile.encoding=UTF-8
org.gradle.parallel=true

# ABIs to build. Phones need arm64-v8a (64-bit ARM) and armeabi-v7a (32-bit
# ARM, many phones that came with Android 7 to 9); add x86_64 to run it on a
# PC emulator: gradlew assembleDebug -PzeqAbis=arm64-v8a,x86_64
zeqAbis=armeabi-v7a,arm64-v8a

# Version of the APK. The code must go up with every APK given to players,
# or Android refuses to install it over the old one.
zeqVersionCode=7
zeqVersionName=1.4-alpha3
